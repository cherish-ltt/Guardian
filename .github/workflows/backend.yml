name: Backend CI

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - "backend/**.rs"
      - "backend/**.proto"
      # 迁移 SQL 的语法错误只在启动时才暴露，改它必须跑后端测试
      - "backend/migrations/**.sql"
      - "backend/Cargo.toml"
      - "backend/Cargo.lock"
      - "backend/vendor/**/Cargo.toml"
      - "backend/.rustfmt.toml"
      - "backend/.clippy.toml"
      # 环境变量模板与代码里的默认值、启动校验绑定，改它要验证
      - "backend/.env-example"
      # 文档里写的是可执行命令，断链与失效命令需要能拦住
      - "backend/docs/**.md"
      - "backend/AGENTS.md"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - "backend/**.rs"
      - "backend/**.proto"
      # 迁移 SQL 的语法错误只在启动时才暴露，改它必须跑后端测试
      - "backend/migrations/**.sql"
      - "backend/Cargo.toml"
      - "backend/Cargo.lock"
      - "backend/vendor/**/Cargo.toml"
      - "backend/.rustfmt.toml"
      - "backend/.clippy.toml"
      # 环境变量模板与代码里的默认值、启动校验绑定，改它要验证
      - "backend/.env-example"
      # 文档里写的是可执行命令，断链与失效命令需要能拦住
      - "backend/docs/**.md"
      - "backend/AGENTS.md"
      - ".github/workflows/backend.yml"

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  check:
    name: Check & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          components: rustfmt, clippy

      - name: Show rustup info
        run: rustup show

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy (lints)
        run: cargo clippy --all-targets --features docs -- -D warnings

      - name: Check release + docs combination
        run: cargo check --release --features docs

      - name: Build the project
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --features docs --verbose
