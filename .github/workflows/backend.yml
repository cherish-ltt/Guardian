name: Backend CI

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - "backend/**/*.rs"
      - "backend/**/*.proto"
      # 迁移 SQL 的语法错误只在启动时才暴露，改它必须跑后端测试
      - "backend/migrations/**/*.sql"
      - "backend/Cargo.toml"
      - "backend/Cargo.lock"
      - "backend/vendor/**/Cargo.toml"
      # vendor 里的代码参与编译，改了必须重新验证
      - "backend/vendor/**/*.rs"
      - "backend/.rustfmt.toml"
      - "backend/.clippy.toml"
      # 环境变量模板与代码里的默认值、启动校验绑定，改它要验证
      - "backend/.env-example"
      # 文档里写的是可执行命令，断链与失效命令需要能拦住
      - "backend/docs/**/*.md"
      - "backend/AGENTS.md"
      - "scripts/check-coverage.py"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - "backend/**/*.rs"
      - "backend/**/*.proto"
      # 迁移 SQL 的语法错误只在启动时才暴露，改它必须跑后端测试
      - "backend/migrations/**/*.sql"
      - "backend/Cargo.toml"
      - "backend/Cargo.lock"
      - "backend/vendor/**/Cargo.toml"
      # vendor 里的代码参与编译，改了必须重新验证
      - "backend/vendor/**/*.rs"
      - "backend/.rustfmt.toml"
      - "backend/.clippy.toml"
      # 环境变量模板与代码里的默认值、启动校验绑定，改它要验证
      - "backend/.env-example"
      # 文档里写的是可执行命令，断链与失效命令需要能拦住
      - "backend/docs/**/*.md"
      - "backend/AGENTS.md"
      - "scripts/check-coverage.py"
      - ".github/workflows/backend.yml"

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  check:
    name: Check & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          components: rustfmt, clippy

      - name: Show rustup info
        run: rustup show

      # 覆盖率门槛依赖 cargo-llvm-cov；用 taiki-e 的 action 装预编译二进制，
      # 避免每次从源码编译。
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy (lints)
        run: cargo clippy --all-targets --features docs -- -D warnings

      - name: Check release + docs combination
        run: cargo check --release --features docs

      - name: Build the project
        run: cargo build --verbose

      # 用 llvm-cov 跑测试：它本身就是一次完整测试执行，再单独 cargo test 等于跑两遍。
      # AGENTS.md 10.1 要求行覆盖率 >= 80%，此前只在文档里约定、CI 没有护栏；
      # 门槛按全局行覆盖率卡，不按文件。
      - name: Run tests with coverage
        run: |
          set -euo pipefail
          cargo llvm-cov --features docs --summary-only --json --output-path coverage.json
          python3 ../scripts/check-coverage.py coverage.json
