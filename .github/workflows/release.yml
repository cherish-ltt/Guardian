name: Release

# 版本发布：打 tag 触发构建，产物挂到对应的 GitHub Release。
# 发布说明取自 docs/<tag>.md（如 docs/v0.3.0.md），由该文件分前后端罗列变动。
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release notes
        id: notes
        run: |
          # 发布说明按 tag 名取文件：v0.3.0 -> docs/v0.3.0.md
          notes_file="docs/${GITHUB_REF_NAME}.md"
          if [ ! -f "$notes_file" ]; then
            echo "缺少发布说明文件 $notes_file：每个版本必须在 docs/ 下提供分前后端的变动清单" >&2
            exit 1
          fi
          echo "file=$notes_file" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Build backend release binary
        working-directory: backend
        run: cargo build --release --locked

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend bundle
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Package artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          # 后端：release 二进制 + 迁移目录 + 环境变量模板，解压即可部署
          tar -C backend -czf "dist/guardian-backend-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" \
            target/release/guardian-backend migrations .env-example
          # 前端：构建产物
          tar -C frontend -czf "dist/guardian-frontend-${GITHUB_REF_NAME}.tar.gz" dist
          ls -l dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "${{ steps.notes.outputs.file }}" \
            dist/*
