name: Release

# 版本发布：打 tag 触发构建，产物挂到对应的 GitHub Release。
# 发布说明取自 docs/version/<tag>.md（如 docs/version/v0.3.0.md），按前后端分节罗列变动。
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  notes:
    name: Resolve release notes
    runs-on: ubuntu-24.04
    outputs:
      file: ${{ steps.resolve.outputs.file }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release notes
        id: resolve
        run: |
          # 发布说明按 tag 名取文件：v0.3.0 -> docs/version/v0.3.0.md
          notes_file="docs/version/${GITHUB_REF_NAME}.md"
          if [ ! -f "$notes_file" ]; then
            echo "缺少发布说明文件 $notes_file：每个版本必须在 docs/version/ 下提供分前后端的变动清单" >&2
            exit 1
          fi
          echo "file=$notes_file" >> "$GITHUB_OUTPUT"

  backend:
    name: Build backend (${{ matrix.target }})
    needs: notes
    strategy:
      # 一个目标失败时其他仍要跑完，便于判断是目标特有问题还是共性问题
      fail-fast: false
      matrix:
        include:
          # gnu 目标在原生 runner 上直接编译，不交叉编译
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            arch: x86_64
            libc: gnu
            musl: false
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            arch: aarch64
            libc: gnu
            musl: false
          # musl 目标静态链接：x86_64 在原生 runner 上直接编，aarch64 需要交叉工具链
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            arch: x86_64
            libc: musl
            musl: true
          - runner: ubuntu-24.04
            target: aarch64-unknown-linux-musl
            arch: aarch64
            libc: musl
            musl: true
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # musl 静态链接需要对应的 musl C 工具链（aws-lc-rs 与 sqlx 都含 C 代码）。
      # 上游 apt 只有 x86_64 的 musl-tools；aarch64 的 musl gcc 由 musl.cc 的预编译包提供，
      # 不能用 aarch64-linux-gnu-gcc 充数：那是 glibc 工具链，链接 musl 目标会缺 stat64 等符号。
      - name: Install musl toolchain (x86_64)
        if: matrix.musl && matrix.arch == 'x86_64'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install musl toolchain (aarch64)
        if: matrix.musl && matrix.arch == 'aarch64'
        run: |
          set -euo pipefail
          curl -sfL -o /tmp/aarch64-linux-musl-cross.tgz \
            https://musl.cc/aarch64-linux-musl-cross.tgz
          sudo tar -xzf /tmp/aarch64-linux-musl-cross.tgz -C /opt
          echo "/opt/aarch64-linux-musl-cross/bin" >> "$GITHUB_PATH"
          echo "CC_aarch64_unknown_linux_musl=aarch64-linux-musl-gcc" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-musl-gcc" >> "$GITHUB_ENV"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          key: ${{ matrix.target }}

      - name: Build backend release binary
        working-directory: backend
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package backend
        run: |
          set -euo pipefail
          mkdir -p dist/stage
          # 只打二进制与环境变量模板：迁移 SQL 由 sqlx::migrate! 在编译期嵌入，运行时不再读目录
          cp "backend/target/${{ matrix.target }}/release/guardian-backend" dist/stage/
          cp backend/.env-example dist/stage/
          archive="dist/guardian-backend-${GITHUB_REF_NAME}-${{ matrix.arch }}-linux-${{ matrix.libc }}.tar.gz"
          tar -C dist/stage -czf "$archive" guardian-backend .env-example
          rm -rf dist/stage
          tar -tzf "$archive"
          ls -l dist

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-${{ matrix.arch }}-${{ matrix.libc }}
          path: dist/*.tar.gz
          if-no-files-found: error

  frontend:
    name: Build frontend
    needs: notes
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 前端产物与 CPU 架构无关，只构建一份
      - name: Build frontend bundle
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Package frontend
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -C frontend -czf "dist/guardian-frontend-${GITHUB_REF_NAME}.tar.gz" dist
          ls -l dist

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [notes, backend, frontend]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # 环境变量模板随本 tag 的源码一起附到下载页，与二进制包内的副本同源
      - name: Attach env template
        run: cp backend/.env-example "dist/env-example-${GITHUB_REF_NAME}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "${{ needs.notes.outputs.file }}" \
            dist/*
