[package]
name = "guardian-backend"
version = "0.2.0"
edition = "2024"
rust-version = "1.99.0"
authors = ["Guardian team"]
license = "MIT OR Apache-2.0"
description = "Guardian 后台管理系统的 axum + sea-orm 后端"
repository = "https://github.com/cherish-ltt/Guardian"
keywords = ["axum", "swagger", "seaorm", "jwt", "admin"]
categories = ["web-programming", "development-tools"]

[features]
# 默认构建只包含脚手架实际用到的依赖；未引用的库不预置，需要时按 `=` 锁定版本后新增声明。
default = []
# 仅开发/文档构建启用 Swagger：utoipa 与 swagger-ui 不进入默认与 release 编译
#（docs_enabled 也跟随该 feature，见 services/system.rs）。
docs = ["dep:utoipa", "dep:utoipa-swagger-ui"]

[dependencies]
# 错误处理与抽象
anyhow = "=1.0.104"
async-trait = "=0.1.92"
thiserror = "=2.0.21"

# Web 框架与 HTTP 中间件
# axum 默认 feature 含 form / original-uri / tower-log，本项目均未使用，
# 因此关掉默认集后按实际用到的能力逐项列出：
#   http1+tokio → axum::serve；json → Json（提取器与响应）；query → Query；tracing → 内部 span；
#   matched-path → 诊断日志里的路由模板。
axum = { version = "=0.8.9", default-features = false, features = [
  "http1",
  "json",
  "matched-path",
  "query",
  "tokio",
  "tracing",
] }
# util 提供 ServiceBuilder::map_response，用于把栈内响应体统一收敛为 axum::body::Body。
tower = { version = "=0.5.3", features = ["buffer", "limit", "load-shed", "util"] }
tower-http = { version = "=0.7.1", features = [
  "catch-panic",
  "compression-gzip",
  "cors",
  "limit",
  "request-id",
  "set-header",
] }

# 可信代理网段解析（客户端 IP 识别）
ipnet = "=2.12.0"

# User-Agent 解析（登录日志的浏览器与操作系统）
# 规则表已随 crate 发布、无需任何 feature；构建期生成规则用的 generate feature 不启用。
woothee = "=0.13.0"

# 离线 IP 地名库查询客户端（日志的 location 列）
# 官方 crate 未上 crates.io 且会把生成工具 maker（clap / chrono 等约 70 个包）拖进依赖树，
# 因此 vendor 到 vendor/ip2region：保留官方查询实现，maker 换成只含头部解析的本地模块。
ip2region = { version = "=0.2.1", path = "vendor/ip2region" }

# 异步运行时与性能
# 不用 "full"：按实际调用面逐项开启（macros 覆盖 main/test/select!，time 覆盖 timeout/sleep，
# net 覆盖 TcpListener，signal 覆盖 ctrl_c/SIGTERM，rt-multi-thread 覆盖多线程运行时）。
tokio = { version = "=1.53.3", features = [
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "time",
] }
mimalloc = "=0.1.52"

# 响应体积与正文改写
http-body-util = "=0.1.5"

# 缓存与会话撤销
redis = { version = "=1.7.1", default-features = false, features = [
  "tokio-comp",
  "connection-manager",
] }

# 代码生成包下载
zip = { version = "=9.0.3", default-features = false, features = [
  "deflate-flate2-zlib-rs",
] }

# 配置与时间
chrono = "=0.4.45"
dotenv = "=0.15"

# 数据序列化与持久化
# sea-orm 关掉默认集：默认打开的 with-json / with-chrono / with-uuid / with-time /
# with-rust_decimal / stream 都没被用到（实体列只有 i64 与 String，也没有流式查询）。
# runtime-tokio 而非 runtime-tokio-rustls：只支持 SQLite，TLS 后端是纯开销。
sea-orm = { version = "=2.0.4", default-features = false, features = [
  "macros",
  "runtime-tokio",
  "sqlite-use-returning-for-3_35",
  "sqlx-sqlite",
] }

# SQL 迁移（与 sea-orm 共用同一 sqlx 版本，避免重复编译；migrate! 宏需要 macros）
sqlx = { version = "=0.9.0", default-features = false, features = [
  "runtime-tokio",
  "sqlite",
  "migrate",
  "macros",
] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

# 鉴权与密码学
argon2 = "=0.6.0"
jsonwebtoken = { version = "=11", features = ["aws_lc_rs"] }

# 可观测性
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = [
  "env-filter",
  "fmt",
  "time",
  "local-time",
] }
tracing-appender = "=0.2.5"
time = { version = "=0.3.55", features = ["macros"] }

# OpenAPI 与调试文档（需要时通过 --features docs 启用）
utoipa = { version = "=6.0.0", optional = true }
utoipa-swagger-ui = { version = "=10.0.1", features = [
  "axum",
  "vendored",
], optional = true }

# 标识工具
uuid = { version = "=1.28.0", features = ["v7"] }

# 开发依赖
[dev-dependencies]
# HTTP 服务与中间件测试工具
tower = { version = "=0.5.3", features = ["util"] }

# 编译优化配置
# release 产物以体积为优先：`lto` 做跨 crate 内联、`codegen-units = 1` 让优化器看到全部代码，
# 两者都不改变业务语义（代价是 release 构建变慢，CI 只跑 debug 构建与 `cargo check --release`，不受影响）。
# 未加 `strip = "symbols"`：保留符号表以便生产 panic 能打出可读栈帧。
[profile.release]
lto = true
codegen-units = 1
